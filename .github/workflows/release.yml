name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@41b239dfe055a266ef7aedf204c2fc997f247a35 # v2.2.7
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
