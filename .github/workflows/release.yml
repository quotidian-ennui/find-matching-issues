name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@5fe3301a3906df8e2310b10c9eb814a72ab670f2 # v2.2.11
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
