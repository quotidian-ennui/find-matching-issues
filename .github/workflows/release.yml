name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@d1d56e91660ddd4d83ff65054d4d6efc5adfc77b # v2.2.5
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
