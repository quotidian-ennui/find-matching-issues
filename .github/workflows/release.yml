name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@31b0c5330537ddcec7a0ad536bb2c960ecb63e72 # v2.2.8
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
