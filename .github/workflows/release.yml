name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@c320b9338c82c82ab6edaf6feb89e0a8ed3fa22e # v2.2.12
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
