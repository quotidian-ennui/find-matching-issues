name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@552a30d3dc628fa89ee8d6a71e9c2257718b90ca # v2.2.9
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
