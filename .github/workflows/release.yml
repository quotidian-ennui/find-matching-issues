name: release
on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  create-release:
    uses: quotidian-ennui/workflows-olio/.github/workflows/create-release.yml@cfbc733e68762bde7bae6a2fd901cec152f15b44 # v2.2.10
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
